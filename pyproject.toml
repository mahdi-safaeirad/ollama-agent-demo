[project]
name = "ollama-agent-demo"
version = "0.1.0"
description = "LangChain/LangGraph learning demo with Ollama: tools, memory, streaming and summarization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"